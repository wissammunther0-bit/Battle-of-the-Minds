<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>معركة العقول | Battle of the Minds — صفحة قانونية</title>
<style>
  :root {
    --brand: #6c4df6; --brand2: #00c2a8; --ink: #1c2333; --muted: #64748b;
    --bg: #f5f6fb; --card: #ffffff; --line: #e5e8f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: 'Segoe UI', Tahoma, 'Noto Kufi Arabic', 'Cairo', sans-serif;
  }
  header {
    background: linear-gradient(135deg, var(--brand), var(--brand2));
    color: #fff; text-align: center; padding: 46px 16px 40px;
  }
  header .logo { font-size: 52px; }
  header h1 { margin: 8px 0 6px; font-size: 30px; }
  header p { margin: 0; opacity: .92; font-size: 15px; }
  main { max-width: 640px; margin: 0 auto; padding: 30px 16px 60px; }
  a.legal-link {
    display: flex; align-items: center; gap: 14px; text-decoration: none;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 18px 20px; margin-bottom: 14px; color: var(--ink);
    box-shadow: 0 4px 18px rgba(30, 40, 90, .06); transition: transform .15s;
  }
  a.legal-link:hover { transform: translateY(-2px); }
  .ico { font-size: 30px; }
  b.t { font-size: 17px; display: block; }
  span.d { color: var(--muted); font-size: 13.5px; }
  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 26px; }
</style>
</head>
<body>
<header>
  <div class="logo">🧠⚔️</div>
  <h1>معركة العقول</h1>
  <p>Battle of the Minds — لعبة أسئلة ومواجهات ذهنية</p>
</header>
<main>
  <a class="legal-link" href="terms.html">
    <span class="ico">📜</span>
    <span><b class="t">شروط الاستخدام</b><span class="d">قواعد اللعب، الحساب، العملات الافتراضية، الإعلانات، والعمر المناسب (13+)</span></span>
  </a>
  <a class="legal-link" href="privacy.html">
    <span class="ico">🔒</span>
    <span><b class="t">سياسة الخصوصية</b><span class="d">ما نجمعه من بيانات، كيف نحميه، الإعلانات، وحقك في الحذف</span></span>
  </a>
  <footer>هذه الصفحات تُدار من لوحة إدارة اللعبة وتتحدّث لحظيًا</footer>
</main>
</body>
</html>
