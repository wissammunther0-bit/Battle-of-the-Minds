<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preview v22</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="styles/v6.css" />
  <link rel="stylesheet" href="styles/v12.css" />
  <link rel="stylesheet" href="styles/v14.css" />
  <link rel="stylesheet" href="styles/versusbar.css" />
  <link rel="stylesheet" href="styles/v16.css" />
  <link rel="stylesheet" href="styles/v17.css" />
  <link rel="stylesheet" href="styles/v19.css" />
  <link rel="stylesheet" href="styles/v20.css" />
  <link rel="stylesheet" href="styles/v21.css" />
  <link rel="stylesheet" href="styles/v22.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #02060f; }
    #app { display: flex; flex-direction: column; height: 100dvh; }
    .view { display: flex; }
  </style>
</head>
<body>
  <div id="app">
    <section id="view-game" class="view active">
      <div class="game-layout-v2">
        <div class="game-3d">
          <button id="btn-exit-game" class="exit-btn" title="انسحاب من الجولة">
            <span>انسحاب</span>
            <span class="ex-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="ico" aria-hidden="true"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg></span>
          </button>
          <div id="arena-stage" class="arena-stage">
            <div class="arena-backdrop">
              <div class="arena-beam b1"></div>
              <div class="arena-beam b2"></div>
              <div class="arena-grid"></div>
              <div class="arena-spot"></div>
              <div class="arena-flash"></div>
            </div>
            <div class="duel-wrap">
              <div class="duel-row">
                <div class="duel-side me" data-side="me">
                  <div class="ds-frame" aria-hidden="true"></div>
                  <div class="ds-chips" data-el="me-chips">
                    <div class="ds-chip me">
                      <span class="ds-av">😎</span>
                      <span class="ds-meta">
                        <span class="ds-name">وسام</span>
                        <span class="ds-lvl">المستوى 15</span>
                      </span>
                      <span class="ds-frozen hidden">❄️</span>
                    </div>
                  </div>
                  <div class="ds-score me" data-el="me-score">1</div>
                  <div class="ds-career-wins" data-el="me-career-wins"><span aria-hidden="true">🏆</span><span class="dw-c"><span>الانتصارات</span><b>0</b></span></div>
                </div>
                <div class="duel-vs" aria-hidden="true">VS</div>
                <div class="duel-side opp" data-side="opp">
                  <div class="ds-frame" aria-hidden="true"></div>
                  <div class="ds-chips" data-el="opp-chips">
                    <div class="ds-chip opp">
                      <span class="ds-av">🦁</span>
                      <span class="ds-meta">
                        <span class="ds-name">الأسد</span>
                        <span class="ds-lvl">المستوى 14</span>
                      </span>
                      <span class="ds-frozen hidden">❄️</span>
                    </div>
                  </div>
                  <div class="ds-score opp" data-el="opp-score">0</div>
                  <div class="ds-career-wins" data-el="opp-career-wins"><span aria-hidden="true">🏆</span><span class="dw-c"><span>الانتصارات</span><b>0</b></span></div>
                </div>
              </div>
              <div class="duel-bar" data-el="bar">
                <div class="vb-ticks"></div>
                <div class="vb-fill me" data-el="fill-me" style="width: 52%;"></div>
                <div class="vb-fill opp" data-el="fill-opp" style="width: 48%;"></div>
                <div class="vb-seam" data-el="seam" style="left: 52%; right: auto;"><span class="vb-sword">⚔️</span></div>
                <div class="vb-pct me" data-el="pct-me">52%</div>
                <div class="vb-pct opp" data-el="pct-opp">48%</div>
                <div class="vb-sparks" data-el="sparks"></div>
              </div>
            </div>
          </div>
          <span id="q-timer" class="timer"><span class="tm-num">10</span><span class="tm-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4"/><path d="M4.6 11a8 8 0 0 0 14.8 4.5"/><path d="M17.5 3.5 19 5"/><circle cx="12" cy="13" r="8"/><path d="M12 13V9"/><path d="M12 13h3"/></svg></span></span>
          <div id="game-overlay" class="game-overlay hidden"></div>
        </div>

        <div class="game-quiz-v2">
          <div class="quiz-topbar">
            <div id="q-tools" class="q-tools"></div>
          </div>
          <div id="q-meta" class="q-meta">
            <span class="qm-round" data-el="round-chip">
              <span class="qmr-trophy" aria-hidden="true">🏆</span>
              <span data-el="round-text">الجولة 1 / 11</span>
            </span>
            <span class="qm-chip gold">⚔️ أول إجابة صحيحة تكسب النقطة</span>
          </div>
          <p id="q-text" class="question-text">كم عمر احمد ؟</p>
          <div id="q-options" class="options">
            <button class="option"><span class="opt-letter" aria-hidden="true">أ</span><span class="opt-text">11</span></button>
            <button class="option"><span class="opt-letter" aria-hidden="true">ب</span><span class="opt-text">12</span></button>
            <button class="option"><span class="opt-letter" aria-hidden="true">ج</span><span class="opt-text">13</span></button>
            <button class="option"><span class="opt-letter" aria-hidden="true">د</span><span class="opt-text">14</span></button>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script>
    // أدوات المساعدة الخمسة — بنفس بنية answers.js renderTools
    const FREEZE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ico"><line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="19.1" y2="19.1"/><line x1="19.1" y1="4.9" x2="4.9" y2="19.1"/></svg>';
    const SKIP = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none" class="ico"><polygon points="5,4 15,12 5,20"/><polygon points="13,4 23,12 13,20"/></svg>';
    const SWAP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="ico"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>';
    const TOOLS = [
      { id: 'skip',    ico: SKIP,  cls: 'tool-skip', l1: 'تخطي', l2: 'السؤال' },
      { id: 'swap',    ico: SWAP,  cls: '', l1: 'تغيير', l2: 'السؤال' },
      { id: 'freeze1', ico: FREEZE, cls: '', l1: 'تجميد الخصم', l2: 'سؤال واحد' },
      { id: 'freeze2', ico: `<span class="qt-ico-sm">${FREEZE}</span>${FREEZE}`, cls: '', l1: 'تجميد الخصم', l2: 'سؤالان' },
      { id: 'freeze3', ico: `<span class="qt-ico-dbl">${FREEZE}${FREEZE}</span>`, cls: '', l1: 'تجميد الخصم', l2: '3 أسئلة' }
    ];
    document.getElementById('q-tools').innerHTML = TOOLS.map(t => `
      <button class="q-tool ${t.cls}" data-tool="${t.id}">
        <span class="qt-ico">${t.ico}</span>
        <span class="qt-label">${t.l1}<small>${t.l2}</small></span>
        <span class="qt-count">2</span>
      </button>`).join('');
  </script>
</body>
</html>
